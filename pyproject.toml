[project]
name = "censor-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "better-profanity>=0.7.0",
    "asyncpg>=0.30.0",
    "fastapi[all]>=0.162.0",
    "psycopg2>=2.9.13",
    "pydantic-settings>=2.0.0",
    "pydub>=0.25.1",
    "passlib[argon2]>=1.7.4",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy[asyncio]>=2.0.0",
    "sqlmodel>=0.0.48",
    "pyjwt>=2.15.1",
    "alembic>=1.20.1",
    "redis>=8.1.0",
    "celery>=5.6.3",
    "boto3>=1.43.124",
    "replicate>=1.0.7",
    "polar-sdk>=1.0.2",
    "propelauth-fastapi>=4.4.0",
    "svix>=2.9.1",
]

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
]

[tool.poe.tasks]
worker = "celery -A app.worker.tasks worker --loglevel=info --pool=solo"
